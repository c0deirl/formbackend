<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Website Form Submission</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #a3a3a3;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #0a0a0a;
        }
        .header {
            background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.2);
            margin: auto;
            text-align: center;
        }
        .content {
            background-color: #161616;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            border: 1px solid #252525;
        }
        .details-list {
            background-color: #1c1c1c;
            padding: 18px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #f59e0b;
        }
        .details-list li {
            margin: 8px 0;
            font-size: 14px;
            color: #f0f0f0;
        }
        .message-box {
            background-color: #1c1c1c;
            padding: 18px;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
            margin: 15px 0;
            color: #f0f0f0;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #666666;
            text-align: center;
            padding: 15px;
            background-color: #161616;
            border-radius: 10px;
            border: 1px solid #252525;
        }
        .website-badge {
            display: inline-block;
            background-color: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
        }
        .website-badge2 {
            display: flex;
            background-color: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 12px;
            margin: auto;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.03em;
        }
        h3 {
            color: #666666;
            margin-top: 0;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        strong {
            color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>New Website Form Submission Received</h2>
        <div class="website-badge2">https://codemov.com</div>
    </div>
    
    <div class="content">
        <div class="details-list">
            <h3>&#128203; Submission Details</h3>
            <ul>
                <li><strong>Website:</strong> {{website_id}}</li>
                <li><strong>Name:</strong> {{name}}</li>
                <li><strong>Email:</strong> {{email}}</li>
            </ul>
        </div>

        <div class="message-box">
            <h3>&#128221; Project Details</h3>
            <p>{{message}}</p>
        </div>
    </div>

    <div class="footer">
        <p>This email was automatically generated from the codemov.com form submission system.</p>
        <p style="margin-top: 8px;"></p>
    </div>
</body>
</html>
